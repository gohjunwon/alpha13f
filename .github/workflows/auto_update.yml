name: Auto Update SEC 13F Data

on:
  schedule:
    # 30분마다 실행은 Cloudflare 알람이 보냅니다. 아래는 예비용(하루 한 번)
    - cron: '13 0 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 즉시 실행 허용

permissions:
  contents: write

jobs:
  update-13f-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install edgartools pandas

      - name: Run SEC 13F scraper
        run: python update_13f.py

      - name: Commit and push updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update SEC 13F portfolio data" && git push)
